source /boot/grub/config.cfg

# Live boot
menuentry "Live system (icewm)" {
	linux @KERNEL_LIVE@ @APPEND_LIVE@ module=icewm
	initrd @INITRD_LIVE@
}

menuentry "Live system (cli)" {
	linux @KERNEL_LIVE@ @APPEND_LIVE@ module=cli
	initrd @INITRD_LIVE@
}

menuentry "Live system (lxqt)" {
	linux @KERNEL_LIVE@ @APPEND_LIVE@ module=lxqt
	initrd @INITRD_LIVE@
}


menuentry "Live system, copy to RAM" {
	linux @KERNEL_LIVE@ @APPEND_LIVE@ module=icewm toram
	initrd @INITRD_LIVE@
}

menuentry "Live system, safe mode" {
	linux @KERNEL_LIVE@ @APPEND_LIVE@ module=cli bootkit.safe=1
	initrd @INITRD_LIVE@
}

menuentry "Live system (cli fail-safe mode)" {
	linux @KERNEL_LIVE@ @LB_BOOTAPPEND_LIVE_FAILSAFE@ module=cli
	initrd @INITRD_LIVE@
}

# Installer (if any)
if @ENABLE_INSTALL_MENU@; then

source	/boot/grub/install_start.cfg

submenu 'Advanced install options ...' --hotkey=a {

	source /boot/grub/theme.cfg

	source	/boot/grub/install.cfg

}
fi

submenu 'Utilities...' --hotkey=u {

	source /boot/grub/theme.cfg

	# Memtest (if any)
	if @ENABLE_MEMTEST@; then
		source /boot/grub/memtest.cfg
	fi

	# Firmware setup (UEFI)
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
	fi

	# Verify the checksums
	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Verify integrity of the boot medium" --hotkey=v {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@ module=cli
			initrd	@INITRD_LIVE@
		}
	fi
}

# BEGIN BOOTKIT SURVEY
menuentry "Hardware survey: generic, auto" {
	linux @KERNEL_LIVE@ @APPEND_LIVE@ module=cli bootkit.safe=1 bootkit.survey=generic
	initrd @INITRD_LIVE@
}

menuentry "Hardware survey: Lenovo G560, auto" {
	linux @KERNEL_LIVE@ @APPEND_LIVE@ module=cli bootkit.safe=1 bootkit.survey=g560
	initrd @INITRD_LIVE@
}

menuentry "Hardware survey: ThinkPad Edge 14 (0578), auto" {
	linux @KERNEL_LIVE@ @APPEND_LIVE@ module=cli bootkit.safe=1 bootkit.survey=edge14-0578
	initrd @INITRD_LIVE@
}
# END BOOTKIT SURVEY
