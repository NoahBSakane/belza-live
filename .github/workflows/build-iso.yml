name: build-iso

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "auto/**"
      - "config/**"
      - ".github/workflows/build-iso.yml"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Build the ISO in a Debian trixie container
        run: |
          docker run --rm --privileged --security-opt seccomp=unconfined \
            -e ARCH=${{ matrix.arch }} \
            -v "$PWD":/work -w /work debian:trixie bash -euxc '
              apt-get update
              if [ "$ARCH" = amd64 ]; then
                EXTRA="syslinux syslinux-common isolinux grub-efi-amd64-bin grub-pc-bin"
              else
                EXTRA="grub-efi-arm64-bin"
              fi
              apt-get install -y --no-install-recommends \
                live-build debootstrap xorriso $EXTRA \
                squashfs-tools ca-certificates git sudo dosfstools mtools cpio
              ./auto/config
              ./auto/build
            '

      - name: Checksums
        run: |
          ls -la *.iso
          sha256sum *.iso | tee SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: belza-live-iso-${{ matrix.arch }}
          path: |
            *.iso
            SHA256SUMS
            build.log
          retention-days: 30
