# conf_replace: /boot/grub/grub.cfg (Ventoy normal boot mode only).
set default=0
set timeout=30
loadfont unicode
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray
set gfxpayload=keep

menuentry "Lubuntu-modoki (LXQt)" {
    linux /casper/vmlinuz bootkit.session=lubuntu --- quiet splash
    initrd /casper/initrd
}
menuentry "Lubuntu-modoki (safe graphics)" {
    linux /casper/vmlinuz bootkit.session=lubuntu nomodeset --- quiet splash
    initrd /casper/initrd
}
menuentry "Lubuntu-modoki (copy to RAM)" {
    linux /casper/vmlinuz bootkit.session=lubuntu toram --- quiet splash
    initrd /casper/initrd
}
menuentry "Ubuntu Server-modoki (text mode)" {
    linux /casper/vmlinuz systemd.unit=multi-user.target bootkit.session=server --- quiet
    initrd /casper/initrd
}
menuentry "Ubuntu Server-modoki (copy to RAM)" {
    linux /casper/vmlinuz systemd.unit=multi-user.target bootkit.session=server toram --- quiet
    initrd /casper/initrd
}
menuentry "Ubuntu with Server (GNOME)" {
    linux /casper/vmlinuz --- quiet splash
    initrd /casper/initrd
}
menuentry "Ubuntu with Server (safe graphics)" {
    linux /casper/vmlinuz nomodeset --- quiet splash
    initrd /casper/initrd
}
menuentry "Ubuntu with Server (copy to RAM)" {
    linux /casper/vmlinuz toram --- quiet splash
    initrd /casper/initrd
}
if [ "$grub_platform" = "efi" ]; then
    menuentry "Boot from next volume" {
        exit 1
    }
    menuentry "UEFI Firmware Settings" {
        fwsetup
    }
fi
