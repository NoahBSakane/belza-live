#cloud-config
# ディスクは storage 画面で人が選ぶ。Ventoy USB を選ばないこと。
# 自動化する場合だけ、公式仕様で末尾を確かめた
# $$VT_LINUX_DISK_NONVTOY_CLOSEST_...$$ を storage.match 等に指定する。
# これは接頭辞の説明用であり、有効な変数名でも安全確認の代用でもない。
autoinstall:
  version: 1
  source: {id: ubuntu-desktop-minimal}
  interactive-sections: [storage, identity]
  locale: en_US.UTF-8
  keyboard: {layout: jp}
  timezone: Asia/Tokyo
  ssh: {install-server: false}
  packages: [ubuntu-server, openssh-server, linux-generic]
  late-commands:
    # 索引上の実在と公式 Server manifest との差は未確認。索引検査で別途確認する。
    - |
      curtin in-target --target=/target -- sh -eu -c '
        for package in ubuntu-desktop ubuntu-desktop-minimal gdm3 gnome-shell gnome-session ubuntu-session gnome-control-center gnome-terminal nautilus yelp; do
          if dpkg -s "$package" >/dev/null 2>&1; then
            apt-get purge -y "$package"
          fi
        done
      '
    - |
      curtin in-target --target=/target -- sh -eu -c '
        if command -v snap >/dev/null 2>&1; then
          installed=$(snap list)
          for package in firefox snap-store thunderbird; do
            if printf "%s\n" "$installed" | awk -v name="$package" "\$1 == name { found=1 } END { exit !found }"; then
              snap remove "$package"
            fi
          done
        fi
      '
    - curtin in-target --target=/target -- apt-get autoremove --purge -y
    - curtin in-target --target=/target -- systemctl set-default multi-user.target
    - |
      curtin in-target --target=/target -- sh -eu -c '
        mkdir -p /etc/netplan
        for file in /etc/netplan/*.yaml; do
          [ -f "$file" ] || continue
          sed -i "s/renderer: *NetworkManager/renderer: networkd/g" "$file"
        done
        config=/etc/netplan/00-installer-config.yaml
        if [ -f "$config" ]; then
          sed -i "/^  renderer:/d; /^network: *$/a\\  renderer: networkd" "$config"
          grep -q "^  renderer: networkd$" "$config"
        else
          printf "%s\n" "network:" "  version: 2" "  renderer: networkd" > "$config"
        fi
        chmod 600 /etc/netplan/00-installer-config.yaml
        netplan generate
        systemctl disable NetworkManager.service NetworkManager-wait-online.service
        systemctl enable systemd-networkd.service systemd-resolved.service
      '
    - curtin in-target --target=/target -- systemctl disable ssh.service ssh.socket
