# 【危険】対象のディスクの内容を、すべて消す。使う前に、必ず対象を確かめること。
# 例: 3 台のディスク(sda・sdb・sdc)に、GPT + 1MiB の BIOS boot + 10GiB の RAID(md RAID1、3 台ミラー)を作り、
# 残りを、ファイルシステムなしのデータ用の区画(区画 3)として残す。Debian 13 の仮想環境(SATA の偽ディスク)で、
# インストールの成功を確かめた構成。実機では、/dev/sda /dev/sdb /dev/sdc を、必ず実際の構成に合わせる。
# 安全装置: ディスクを消す前に、対象が想定どおり(USB でない・取り外し可能でない・容量が範囲内・型番が合う)かを確かめる。
# 1 つでも違えば、何も消さずに電源を切る。MIN・MAX(10 進の GB)と型番(省略可)を、実際の機体に合わせて、必ず書き換えること。
# 書き換えるまでは、数字でないので、必ず失敗して(電源が切れて)、ディスクは消えない。
# このスクリプトは、この ISO の /cdrom/disk-guard.sh にある。市販の ISO と Ventoy の auto_install で使う場合は、
# 同じファイルを、Ventoy の injection などで、/cdrom に置く(ファイルがなければ、失敗して、ディスクは消えない)。
d-i preseed/early_command string sh /cdrom/disk-guard.sh --expect "sda:MIN:MAX,sdb:MIN:MAX,sdc:MIN:MAX" || poweroff -f
d-i partman-auto/disk string /dev/sda /dev/sdb /dev/sdc
d-i partman-auto/method string raid
d-i partman/early_command string mkdir -p /etc/mdadm; printf "CREATE metadata=1.2\n" >> /etc/mdadm/mdadm.conf
d-i partman-partitioning/default_label string gpt
d-i partman-partitioning/choose_label select gpt
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-auto/choose_recipe select belza
d-i partman-auto/expert_recipe string \
    belza :: \
        1 1 1 free \
            $primary{ } $bios_boot{ } method{ biosgrub } . \
        10738 10738 10738 raid \
            $primary{ } method{ raid } . \
        1 1 -1 free .
d-i partman-auto-raid/recipe string \
    1 3 0 ext4 / /dev/sda2#/dev/sdb2#/dev/sdc2 .
d-i partman-md/confirm boolean true
d-i partman-md/confirm_nooverwrite boolean true
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true
d-i partman-basicfilesystems/no_swap boolean false
tasksel tasksel/first multiselect ssh-server
d-i pkgsel/include string mdadm btrfs-progs smartmontools cryptsetup restic curl
d-i pkgsel/upgrade select none
d-i grub-installer/bootdev string /dev/sda /dev/sdb /dev/sdc
# ルートのパスワードと一般ユーザーは、ここには書かない。インストーラーの質問に答えるか、別の preseed で渡す。
